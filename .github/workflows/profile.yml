name: Refresh profile
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s tests
      - name: Fetch public stats and render all themes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/render.py --fetch-stats
      - name: Commit changed output
        run: |
          git add README.md assets/profile-*.svg profile/stats.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile stats'
          git push
