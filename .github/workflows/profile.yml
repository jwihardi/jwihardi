name: Refresh profile
on:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/history.py'
      - 'scripts/stats.py'
      - '.github/workflows/profile.yml'
      - 'tests/test_history.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cache encryption
        run: python -m pip install 'cryptography>=44,<47'
      - name: Restore encrypted history cache
        uses: actions/cache@v4
        with:
          path: .cache/history.enc
          key: profile-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: profile-history-v1-
      - run: python -m unittest discover -s tests
      - name: Refresh all stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python scripts/stats.py
      - name: Render profile
        run: python scripts/render.py
      - name: Commit updates
        run: |
          git add README.md assets profile/stats.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile stats'
          git push
